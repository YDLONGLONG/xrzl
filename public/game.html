<!-- Generated by Trae Work -->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>血染钟楼 - 游戏中</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/game.css">
</head>
<body>
  <!-- 夜晚遮罩 -->
  <div class="night-overlay" id="nightOverlay">
    <div class="night-text" id="nightText">夜幕降临...</div>
    <div class="night-subtext" id="nightSubtext">等待其他玩家行动</div>
    <div class="night-select-area" id="nightSelectArea"></div>
    <button class="btn btn-primary night-confirm-btn" id="nightConfirmBtn" style="display:none;" onclick="submitNightAction()">确认行动</button>
  </div>

  <div class="game-container" id="gameContainer">
    <!-- 头部信息 -->
    <div class="game-header">
      <div class="room-info">
        <span class="room-code" id="headerRoomId"></span>
        <span class="day-count" id="headerDayCount"></span>
      </div>
      <div>
        <span class="phase-badge" id="headerPhase"></span>
      </div>
      <div>
        <button class="btn btn-secondary btn-sm" onclick="leaveRoom()">离开房间</button>
      </div>
    </div>

    <!-- 左侧座位列表 -->
    <div class="seats-area" id="seatsArea"></div>

    <!-- 中央信息区 -->
    <div class="center-area" id="centerArea">
      <div class="center-message" id="centerMessage">等待游戏开始...</div>
      
      <div id="actionPanel" class="action-panel" style="display:none;">
        <div class="action-title" id="actionTitle"></div>
        <div class="selected-targets" id="selectedTargets"></div>
        <div class="action-buttons" id="actionButtons"></div>
      </div>

      <!-- 确认进度 -->
      <div class="confirm-bar" id="confirmBar" style="display:none;">
        <div id="confirmText">等待全员确认...</div>
        <div class="confirm-progress">
          <div class="confirm-progress-fill" id="confirmProgressFill" style="width: 0%"></div>
        </div>
        <button class="btn btn-success btn-sm" id="confirmBtn" style="margin-top: 10px;" onclick="confirmPhase()">我已准备好，进入下一阶段</button>
      </div>
    </div>

    <!-- 右侧聊天区 -->
    <div class="chat-area">
      <div class="chat-tabs">
        <div class="chat-tab active" data-channel="public" onclick="switchChatChannel('public')">公聊</div>
        <div class="chat-tab" data-channel="dead" id="deadChatTab" onclick="switchChatChannel('dead')" style="display:none;">死者</div>
        <div class="chat-tab" data-channel="whisper" onclick="switchChatChannel('whisper')">私聊</div>
      </div>
      <div class="chat-messages" id="chatMessages"></div>
      <div class="chat-input-area">
        <select class="whisper-target-select" id="whisperTarget" style="display:none;"></select>
        <input type="text" id="chatInput" placeholder="输入消息..." maxlength="500" onkeydown="if(event.key==='Enter')sendChat()">
        <button class="btn btn-primary btn-sm" onclick="sendChat()">发送</button>
      </div>
    </div>

    <!-- 底部身份卡 -->
    <div class="role-card" id="roleCard" style="display:none;">
      <div class="role-icon" id="roleIcon">?</div>
      <div class="role-info">
        <div>
          <span class="role-name" id="roleName"></span>
          <span class="role-team" id="roleTeam"></span>
        </div>
        <div class="role-desc" id="roleDesc"></div>
        <div class="evil-teammates" id="evilTeammates" style="display:none;"></div>
      </div>
      <div style="margin-left: auto;">
        <button class="btn btn-sm btn-danger" id="slayerBtn" style="display:none;" onclick="useSlayerAbility()">杀手：击杀恶魔</button>
      </div>
    </div>
  </div>

  <!-- 游戏结束身份展示 -->
  <div id="gameOverPanel" style="display:none; position:fixed; top:0;left:0;right:0;bottom:0; background:rgba(0,0,0,0.95); z-index:150; padding:40px; overflow-y:auto;">
    <div style="max-width:800px; margin:0 auto; text-align:center;">
      <h1 id="gameOverTitle" style="font-size:2.5em; margin-bottom:20px;"></h1>
      <p id="gameOverReason" style="font-size:1.2em; color:#aaa; margin-bottom:30px;"></p>
      <div class="roles-reveal">
        <table>
          <thead>
            <tr><th>座位</th><th>玩家</th><th>角色</th><th>阵营</th><th>状态</th></tr>
          </thead>
          <tbody id="rolesRevealBody"></tbody>
        </table>
      </div>
      <button class="btn btn-primary btn-sm" style="margin-top:30px;" onclick="window.location.href='/'">返回大厅</button>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/common.js"></script>
  <script src="/js/socket-client.js"></script>
  <script src="/js/chat.js"></script>
  <script src="/js/night-phase.js"></script>
  <script src="/js/day-phase.js"></script>
  <script src="/js/game-ui.js"></script>
</body>
</html>
